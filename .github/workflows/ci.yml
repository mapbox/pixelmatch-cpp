name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng
        run: sudo apt-get update && sudo apt-get install -y libpng-dev
      - name: Check formatting
        run: clang-format --dry-run --Werror include/mapbox/*.hpp test/*.cpp test/*.hpp
      - name: Build and test (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Build and test (ASan + UBSan)
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure
